<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <link rel="stylesheet" href="./src/css/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/js/main.js"></script>
    <style id="js-css"></style>
    <script type="module" src="./src/js/index.js"></script>
    <script type="module" src="./src/js/m3.js"></script>
  </head>

  <body style="overflow: hidden;">
    <main class="container">
      <div class="notice">
        <div class="info">
          <header style="color: #00AAFF;">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1" width="40px" height="40px" viewBox="0 0 416.979 416.979" xml:space="preserve"><g><path fill="currentColor" d="M356.004,61.156c-81.37-81.47-213.377-81.551-294.848-0.182c-81.47,81.371-81.552,213.379-0.181,294.85   c81.369,81.47,213.378,81.551,294.849,0.181C437.293,274.636,437.375,142.626,356.004,61.156z M237.6,340.786   c0,3.217-2.607,5.822-5.822,5.822h-46.576c-3.215,0-5.822-2.605-5.822-5.822V167.885c0-3.217,2.607-5.822,5.822-5.822h46.576   c3.215,0,5.822,2.604,5.822,5.822V340.786z M208.49,137.901c-18.618,0-33.766-15.146-33.766-33.765   c0-18.617,15.147-33.766,33.766-33.766c18.619,0,33.766,15.148,33.766,33.766C242.256,122.755,227.107,137.901,208.49,137.901z"/></g></svg>

          </header>
        </div>
      </div>

      <div class="tabs-bar" data-tauri-drag-region>
        <img data-tauri-drag-region src="./src/assets/logo.png" id="logo" class="brand-logo" alt="Glow Squid Minecraft Launcher" />
        <div class="drag-spacer"></div>
        <md-tabs>
          <md-primary-tab active onclick="sidebar_button('home')" inline-icon>
            <md-icon slot="icon">home</md-icon>
            Home
          </md-primary-tab>
          <md-primary-tab onclick="sidebar_button('download')" inline-icon>
            <md-icon slot="icon">download</md-icon>
            Download
          </md-primary-tab>
          <md-primary-tab onclick="sidebar_button('connect')" inline-icon>
            <md-icon slot="icon">wifi</md-icon>
            Connect
          </md-primary-tab>
          <md-primary-tab onclick="sidebar_button('plugins')" inline-icon>
            <md-icon slot="icon">extension</md-icon>
            Plugins
          </md-primary-tab>
          <md-primary-tab onclick="sidebar_button('settings')" inline-icon>
            <md-icon slot="icon">settings</md-icon>
            Settings
          </md-primary-tab>
        </md-tabs>
        <div class="drag-spacer"></div>
        <div class="window-controls">
          <button id="min-btn" class="title-btn" title="Minimize" aria-label="Minimize">
            <md-icon slot="icon">remove</md-icon>
          </button>
          <button id="close-btn" class="title-btn close" title="Close" aria-label="Close">
            <md-icon slot="icon">close</md-icon>
          </button>
        </div>
      </div>
      <div id="main">
        <iframe style="overflow: hidden;" src="/home.html" ></iframe>
        <img src="./src/assets/loading.webp" alt="Loading" id="loading" />
      </div>
    </main>
  </body>
</html>

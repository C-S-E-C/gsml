name: build

on:
  release:
    types: [published]

# GITHUB_TOKEN 默认只读，gh release upload 需要 contents:write
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
          - platform: mac
            runs-on: macos-latest
          - platform: windows
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ===== 新增：检查 release 是否已有该平台全部产物 =====
      - name: Check existing release assets
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          if ! ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "::warning::Cannot read release $TAG, assume need build"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"; VERSION="${VERSION#V}"

          case "$PLATFORM" in
            windows)
              REQUIRED=(
                "^gsml\.exe$"
                "gsml_${VERSION}.*-setup\.exe$"
                "gsml_${VERSION}.*\.msi$"
              )
              ;;
            mac)
              REQUIRED=(
                "${VERSION}.*(x64|x86_64).*\.dmg$"
                "${VERSION}.*(aarch64|arm64).*\.dmg$"
                "aarch64.*\.app\.zip$"
                "x64.*\.app\.zip$"
              )
              ;;
            linux)
              REQUIRED=(
                "gsml_${VERSION}.*\.AppImage$"
                "gsml_${VERSION}.*\.deb$"
                "${VERSION}.*\.rpm$"
              )
              ;;
            *)
              REQUIRED=()
              ;;
          esac

          MISSING=()
          for pat in "${REQUIRED[@]}"; do
            # 宽松正则匹配：兼容 .app.dmg 后缀、rpm 连字符命名等差异
            if ! grep -qE "$pat" <<< "$ASSETS"; then
              MISSING+=("$pat")
            fi
          done

          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "::notice::All required assets exist for $PLATFORM, skip build."
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Missing assets for $PLATFORM:"
            printf '  - %s\n' "${MISSING[@]}"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

      # ===== 同步版本号 =====
      - name: Sync version from release tag
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"; VERSION="${VERSION#V}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver: '$TAG' -> '$VERSION'"; exit 1
          fi
          echo "Using version: $VERSION"

          node - "$VERSION" <<'EOF'
          const fs = require('fs');
          const version = process.argv[2];
          for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = version;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log(`${p} -> ${version}`);
          }
          EOF

          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          path = 'src-tauri/Cargo.toml'
          text = open(path, encoding='utf-8').read()
          m = re.search(r'(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)', text)
          if not m:
              sys.exit('no [package] section in Cargo.toml')
          block = m.group(1)
          new_block, n = re.subn(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{version}"', block, count=1)
          if n == 0:
              new_block = f'version = "{version}"\n' + block
          text = text[:m.start(1)] + new_block + text[m.end(1):]
          open(path, 'w', encoding='utf-8').write(text)
          print(f'{path} -> {version}')
          PY

          git --no-pager diff -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml || true

      - name: Setup pnpm
        if: steps.check.outputs.need_build == 'true'
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段锁定为 pnpm@10：
        # pnpm 9 的 --frozen-lockfile 对 rolldown 可选原生 binding 漏装，
        # 触发 "Cannot find native binding"；pnpm 10 已验证按平台正确安装。
        # 注意：不要在此再写 version，否则会与 packageManager 冲突报
        # ERR_PNPM_BAD_PM_VERSION。

      - name: Setup Node
        if: steps.check.outputs.need_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: pnpm

      - name: Setup Rust
        if: steps.check.outputs.need_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Add mac x86_64 target
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'mac'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Compute cache key parts
        if: steps.check.outputs.need_build == 'true'
        id: cachekey
        shell: bash
        run: |
          RUSTC_HASH=$(rustc -vV | sha256sum | cut -c1-16)
          # 注意：Cargo.toml 已改 version，lock 未变；lock 才是依赖指纹
          LOCK_HASH=$(sha256sum src-tauri/Cargo.lock | cut -c1-16)
          echo "rustc=$RUSTC_HASH" >> "$GITHUB_OUTPUT"
          echo "lock=$LOCK_HASH"   >> "$GITHUB_OUTPUT"

      - name: Cache Rust target and cargo
        if: steps.check.outputs.need_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ matrix.platform }}-${{ steps.cachekey.outputs.rustc }}-${{ steps.cachekey.outputs.lock }}
          restore-keys: |
            rust-${{ matrix.platform }}-${{ steps.cachekey.outputs.rustc }}-
            rust-${{ matrix.platform }}-

      - name: Install dependencies
        if: steps.check.outputs.need_build == 'true'
        run: pnpm install --frozen-lockfile
      # 显式指定 bundle 目标，保证产物齐全：linux=AppImage/deb/rpm，windows=msi/nsis，mac=app/dmg
      # 用重试包裹：cargo 编译有增量缓存，重试主要重做 bundle 阶段的下载
      # （如 AppImage 的 AppRun、windows 的 NSIS 等），可扛过 GitHub 偶发 504。
      - name: Build (release)
        if: steps.check.outputs.need_build == 'true' && !github.event.release.prerelease
        shell: bash
        run: |
          set -euo pipefail
          do_build() {
            case "${{ matrix.platform }}" in
              linux)   pnpm tauri build --bundles appimage,deb,rpm ;;
              windows) pnpm tauri build --bundles msi,nsis ;;
              mac)     pnpm tauri build --bundles app,dmg ;;
            esac
          }
          attempt=0
          until do_build; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "::error::pnpm tauri build failed after $attempt attempts (persistent download/bundle error)."
              exit 1
            fi
            echo "::warning::build attempt $attempt failed; retrying in $((10 * attempt))s…"
            sleep $((10 * attempt))
          done

      - name: Build (debug)
        if: steps.check.outputs.need_build == 'true' && github.event.release.prerelease
        shell: bash
        run: |
          set -euo pipefail
          do_build() {
            case "${{ matrix.platform }}" in
              linux)   pnpm tauri build --bundles appimage,deb,rpm --debug ;;
              windows) pnpm tauri build --bundles msi,nsis --debug ;;
              mac)     pnpm tauri build --bundles app,dmg --debug ;;
            esac
          }
          attempt=0
          until do_build; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "::error::pnpm tauri build (debug) failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::build attempt $attempt failed; retrying in $((10 * attempt))s…"
            sleep $((10 * attempt))
          done

      - name: Build mac x64 (release)
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'mac' && !github.event.release.prerelease
        shell: bash
        run: |
          set -euo pipefail
          attempt=0
          until pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "::error::mac x64 build failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::mac x64 build attempt $attempt failed; retrying in $((10 * attempt))s…"
            sleep $((10 * attempt))
          done

      - name: Build mac x64 (debug)
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'mac' && github.event.release.prerelease
        shell: bash
        run: |
          set -euo pipefail
          attempt=0
          until pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg --debug; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "::error::mac x64 build (debug) failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::mac x64 build attempt $attempt failed; retrying in $((10 * attempt))s…"
            sleep $((10 * attempt))
          done

      - name: Collect artifacts
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e
          PLATFORM="${{ matrix.platform }}"
          OUT="dist/$PLATFORM"; mkdir -p "$OUT"

          # 逐个 bundle 目录收集（含 debug、mac 跨编译 target/x86_64-apple-darwin/...）
          while IFS= read -r B; do
            if [ "$PLATFORM" = "mac" ]; then
              case "$B" in
                *x86_64-apple-darwin*) TAG="_x64" ;;
                *aarch64-apple-darwin*) TAG="_aarch64" ;;
                *) case "$(uname -m)" in x86_64) TAG="_x64" ;; *) TAG="_aarch64" ;; esac ;;
              esac
              # .app 目录不能直接作为 release asset：按架构打成 zip
              find "$B" -maxdepth 3 -type d -name "*.app" | while read -r appdir; do
                parent=$(dirname "$appdir"); base=$(basename "$appdir")
                ( cd "$parent" && ditto -c -k --sequesterRsrc --keepParent "$base" "$OUT/${base%.app}${TAG}.app.zip" )
              done
              find "$B" -maxdepth 3 -type f -name "*.dmg" | while read -r dmg; do
                base=$(basename "$dmg")
                if [ -e "$OUT/$base" ]; then base="${base%.dmg}${TAG}.dmg"; fi
                cp "$dmg" "$OUT/$base"
              done
            elif [ "$PLATFORM" = "linux" ]; then
              # 只取最终产物（bundle/<type>/xxx 共 2 层），排除 AppDir/deb 解包暂存目录
              find "$B" -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} "$OUT/" \;
            elif [ "$PLATFORM" = "windows" ]; then
              find "$B" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} "$OUT/" \;
            fi
          done < <(find src-tauri/target -maxdepth 3 -type d -name bundle | sort)

          # Windows portable exe（裸二进制也上传）
          if [ "$PLATFORM" = "windows" ]; then
            if [ -f src-tauri/target/debug/gsml.exe ]; then
              cp src-tauri/target/debug/gsml.exe "$OUT/"
            else
              cp src-tauri/target/release/gsml.exe "$OUT/"
            fi
          fi

          find "$OUT" -type f | sort || true

      - name: Upload release assets
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          D="dist/${{ matrix.platform }}"
          COUNT=$(find "$D" -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No build outputs to upload for ${{ matrix.platform }}"
            exit 1
          fi
          echo "Uploading $COUNT file(s) to release $TAG:"
          find "$D" -type f -print
          find "$D" -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          echo "::notice::Uploaded $COUNT file(s) to release $TAG"

      - name: Upload workflow artifact
        if: steps.check.outputs.need_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 7

  # ===== 所有平台 build 完成后，把下载 badge 追加到 release 正文 =====
  # 单独一个 job 并在 needs 上等待全部平台，避免并行矩阵互相覆盖 release 正文；
  # 依据 release 上「实际已上传的产物」生成 badge（幂等：已有则替换，无产物则跳过）。
  update-download-badges:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Append download badges to release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 该 job 没有 checkout，gh 需要用 GH_REPO 才能解析目标仓库，
          # 否则 gh 会回退去跑 `git` 而报 "not a git repository"。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          MARKER="## 下载"
          REPO="${GITHUB_REPOSITORY}"

          BODY="$(gh release view "$TAG" --json body --jq '.body')"
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"

          # 生成单个 badge：$1=label, $2=logo（空=不带 logo）, $3=下载链接
          shields() {
            local label="$1" logo="$2" url="$3"
            if [ -n "$logo" ]; then
              printf '[![Static Badge](https://img.shields.io/badge/%s-blue?logo=%s&logoColor=%%23fff)](%s)' \
                "$label" "$logo" "$url"
            else
              printf '[![Static Badge](https://img.shields.io/badge/%s-blue)](%s)' \
                "$label" "$url"
            fi
          }

          L_LINUX=(); L_MAC=(); L_WIN=()
          url_of() { printf 'https://github.com/%s/releases/download/%s/%s' "$REPO" "$TAG" "$1"; }

          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            url="$(url_of "$asset")"

            case "$asset" in
              # ── Linux（logo=linux，标签 amd64-*）──
              *.deb)        badge="$(shields "amd64-deb"    "linux" "$url")"; L_LINUX+=("$badge") ;;
              *.rpm)        badge="$(shields "amd64-rpm"    "linux" "$url")"; L_LINUX+=("$badge") ;;
              *.AppImage)   badge="$(shields "amd64-appimage" "linux" "$url")"; L_LINUX+=("$badge") ;;

              # ── macOS（logo=apple，按架构 aarch64/x64）──
              *.dmg)
                if [[ "$asset" =~ (aarch64|arm64) ]]; then arch="aarch64"; else arch="x64"; fi
                badge="$(shields "${arch}-dmg" "apple" "$url")"; L_MAC+=("$badge") ;;
              *.app.zip)
                if [[ "$asset" =~ (aarch64|arm64) ]]; then arch="aarch64"; else arch="x64"; fi
                badge="$(shields "${arch}-app" "apple" "$url")"; L_MAC+=("$badge") ;;

              # ── Windows（无 logo，标签 windows-*）──
              *.msi)          badge="$(shields "windows-msi" "" "$url")"; L_WIN+=("$badge") ;;
              *-setup.exe|*_setup.exe) badge="$(shields "windows-nsis" "" "$url")"; L_WIN+=("$badge") ;;
              gsml.exe)       badge="$(shields "windows-portable" "" "$url")"; L_WIN+=("$badge") ;;
              *) continue ;;
            esac
          done <<< "$ASSETS"

          # 按平台顺序拼装正文片段
          SECTION=""
          add_section() { # $1=平台标题, 数组经由 stdin 读入
            local title="$1"; local -n arr=$2
            [ ${#arr[@]} -eq 0 ] && return
            SECTION+=$'\n'"**${title}**"$'\n'
            local i
            for ((i=0;i<${#arr[@]};i++)); do
              SECTION+="- ${arr[$i]}"$'\n'
            done
          }
          add_section "Linux"   L_LINUX
          add_section "macOS"   L_MAC
          add_section "Windows" L_WIN

          if [ -z "$SECTION" ]; then
            echo "::notice::No release assets found, skip body update."
            exit 0
          fi

          # 幂等：若正文已含该标记，则截断并整体重写该节
          if grep -qF "$MARKER" <<< "$BODY"; then
            NEW_BODY="${BODY%%$MARKER*}"
          else
            NEW_BODY="$BODY"
          fi
          NEW_BODY+=$'\n\n'"${MARKER}"$'\n'"${SECTION}"

          printf '%s\n' "$NEW_BODY" > body.md
          gh release edit "$TAG" --notes-file body.md
          echo "::notice::Appended download badges to release $TAG"

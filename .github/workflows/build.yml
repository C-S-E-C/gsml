name: build

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
          - platform: mac
            runs-on: macos-latest
          - platform: windows
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ===== 新增：检查 release 是否已有该平台全部产物 =====
      - name: Check existing release assets
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          if ! ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "::warning::Cannot read release $TAG, assume need build"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"; VERSION="${VERSION#V}"

          case "$PLATFORM" in
            windows)
              REQUIRED=(
                "^gsml\.exe$"
                "gsml_${VERSION}.*-setup\.exe$"
                "gsml_${VERSION}.*\.msi$"
              )
              ;;
            mac)
              REQUIRED=(
                "${VERSION}.*(x64|x86_64).*\.dmg$"
                "${VERSION}.*(aarch64|arm64).*\.dmg$"
                "aarch64.*\.app\.zip$"
                "x64.*\.app\.zip$"
              )
              ;;
            linux)
              REQUIRED=(
                "gsml_${VERSION}.*\.AppImage$"
                "gsml_${VERSION}.*\.deb$"
                "${VERSION}.*\.rpm$"
              )
              ;;
            *)
              REQUIRED=()
              ;;
          esac

          MISSING=()
          for pat in "${REQUIRED[@]}"; do
            # 宽松正则匹配：兼容 .app.dmg 后缀、rpm 连字符命名等差异
            if ! grep -qE "$pat" <<< "$ASSETS"; then
              MISSING+=("$pat")
            fi
          done

          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "::notice::All required assets exist for $PLATFORM, skip build."
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Missing assets for $PLATFORM:"
            printf '  - %s\n' "${MISSING[@]}"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

      # ===== 同步版本号 =====
      - name: Sync version from release tag
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"; VERSION="${VERSION#V}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver: '$TAG' -> '$VERSION'"; exit 1
          fi
          echo "Using version: $VERSION"

          node - "$VERSION" <<'EOF'
          const fs = require('fs');
          const version = process.argv[2];
          for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = version;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log(`${p} -> ${version}`);
          }
          EOF

          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          path = 'src-tauri/Cargo.toml'
          text = open(path, encoding='utf-8').read()
          m = re.search(r'(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)', text)
          if not m:
              sys.exit('no [package] section in Cargo.toml')
          block = m.group(1)
          new_block, n = re.subn(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{version}"', block, count=1)
          if n == 0:
              new_block = f'version = "{version}"\n' + block
          text = text[:m.start(1)] + new_block + text[m.end(1):]
          open(path, 'w', encoding='utf-8').write(text)
          print(f'{path} -> {version}')
          PY

          git --no-pager diff -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml || true

      - name: Setup pnpm
        if: steps.check.outputs.need_build == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.check.outputs.need_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        if: steps.check.outputs.need_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Add mac x86_64 target
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'mac'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Compute cache key parts
        if: steps.check.outputs.need_build == 'true'
        id: cachekey
        shell: bash
        run: |
          RUSTC_HASH=$(rustc -vV | sha256sum | cut -c1-16)
          # 注意：Cargo.toml 已改 version，lock 未变；lock 才是依赖指纹
          LOCK_HASH=$(sha256sum src-tauri/Cargo.lock | cut -c1-16)
          echo "rustc=$RUSTC_HASH" >> "$GITHUB_OUTPUT"
          echo "lock=$LOCK_HASH"   >> "$GITHUB_OUTPUT"

      - name: Cache Rust target and cargo
        if: steps.check.outputs.need_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ matrix.platform }}-${{ steps.cachekey.outputs.rustc }}-${{ steps.cachekey.outputs.lock }}
          restore-keys: |
            rust-${{ matrix.platform }}-${{ steps.cachekey.outputs.rustc }}-
            rust-${{ matrix.platform }}-

      - name: Install dependencies
        if: steps.check.outputs.need_build == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install cargo-about
        uses: taiki-e/install-action@cargo-about
      # 显式指定 bundle 目标，保证产物齐全：linux=AppImage/deb/rpm，windows=msi/nsis，mac=app/dmg
      - name: Build (release)
        if: steps.check.outputs.need_build == 'true' && !github.event.release.prerelease
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)   pnpm tauri build --bundles appimage,deb,rpm ;;
            windows) pnpm tauri build --bundles msi,nsis ;;
            mac)     pnpm tauri build --bundles app,dmg ;;
          esac

      - name: Build (debug)
        if: steps.check.outputs.need_build == 'true' && github.event.release.prerelease
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)   pnpm tauri build --bundles appimage,deb,rpm --debug ;;
            windows) pnpm tauri build --bundles msi,nsis --debug ;;
            mac)     pnpm tauri build --bundles app,dmg --debug ;;
          esac

      - name: Build mac x64 (release)
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'mac' && !github.event.release.prerelease
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: Build mac x64 (debug)
        if: steps.check.outputs.need_build == 'true' && matrix.platform == 'mac' && github.event.release.prerelease
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg --debug

      - name: Collect artifacts
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e
          PLATFORM="${{ matrix.platform }}"
          OUT="dist/$PLATFORM"; mkdir -p "$OUT"

          # 逐个 bundle 目录收集（含 debug、mac 跨编译 target/x86_64-apple-darwin/...）
          while IFS= read -r B; do
            if [ "$PLATFORM" = "mac" ]; then
              case "$B" in
                *x86_64-apple-darwin*) TAG="_x64" ;;
                *aarch64-apple-darwin*) TAG="_aarch64" ;;
                *) case "$(uname -m)" in x86_64) TAG="_x64" ;; *) TAG="_aarch64" ;; esac ;;
              esac
              # .app 目录不能直接作为 release asset：按架构打成 zip
              find "$B" -maxdepth 3 -type d -name "*.app" | while read -r appdir; do
                parent=$(dirname "$appdir"); base=$(basename "$appdir")
                ( cd "$parent" && ditto -c -k --sequesterRsrc --keepParent "$base" "$OUT/${base%.app}${TAG}.app.zip" )
              done
              find "$B" -maxdepth 3 -type f -name "*.dmg" | while read -r dmg; do
                base=$(basename "$dmg")
                if [ -e "$OUT/$base" ]; then base="${base%.dmg}${TAG}.dmg"; fi
                cp "$dmg" "$OUT/$base"
              done
            else
              cp -r "$B/." "$OUT/"
            fi
          done < <(find src-tauri/target -maxdepth 3 -type d -name bundle | sort)

          # Windows portable exe（裸二进制也上传）
          if [ "$PLATFORM" = "windows" ]; then
            if [ -f src-tauri/target/debug/gsml.exe ]; then
              cp src-tauri/target/debug/gsml.exe "$OUT/"
            else
              cp src-tauri/target/release/gsml.exe "$OUT/"
            fi
          fi

          find "$OUT" -type f | sort || true

      - name: Upload release assets
        if: steps.check.outputs.need_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          D="dist/${{ matrix.platform }}"
          COUNT=$(find "$D" -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No build outputs to upload for ${{ matrix.platform }}"
            exit 1
          fi
          echo "Uploading $COUNT file(s) to release $TAG:"
          find "$D" -type f -print
          find "$D" -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          echo "::notice::Uploaded $COUNT file(s) to release $TAG"

      - name: Upload workflow artifact
        if: steps.check.outputs.need_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 7

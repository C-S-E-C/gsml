<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <link rel="stylesheet" href="./src/css/home.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/js/m3.js"></script>
  </head>
  <body>

    <!-- ── Accounts (账号选择) ─────────────────────────────── -->
    <div class="sidebar">
      <md-list class="accounts-list" id="accounts-list">
        <!-- 账号列表由 home.js 调用 list_accounts 动态渲染（无示例数据） -->

        <!-- 如果账号太多防止被添加账号FAB阻挡 -->
        <md-list-item></md-list-item>
      </md-list>
      <md-elevated-button id="add-account-btn">
        <md-icon slot="icon">person_add</md-icon>
        Add account
      </md-elevated-button>
    </div>

    <!-- ── Add Account dialog (添加账号对话框) ───────────────
         md-dialog 必须作为 <body> 的直接子元素渲染（否则固定定位/裁剪异常，
         且 cancel/confirm 按钮可能不显示）。登录/存储逻辑由 home.js 实现：
         confirm 按钮无内联 onclick，由 JS 调用 login_offline / login_microsoft，
         成功后才由 JS 关闭对话框；微软登录通过 glow-squid://ms-auth deeplink 回调。 -->
    <md-dialog type="modal" id="add-account-dialog">
      <div slot="headline">Add Account</div>
      <div slot="content">
        <md-tabs id="add-account-tabs">
          <md-primary-tab data-mode="offline" active>Offline</md-primary-tab>
          <md-primary-tab data-mode="microsoft">Microsoft</md-primary-tab>
        </md-tabs>

        <div id="add-account-offline" class="add-account-panel">
          <md-outlined-text-field id="offline-name" label="Player name" required
            supporting-text="Offline 账号仅需一个玩家名"></md-outlined-text-field>
        </div>

        <div id="add-account-microsoft" class="add-account-panel" hidden>
          <p style="margin:0;line-height:1.6;">
            点击 Add 后将打开系统浏览器完成微软登录，登录结果通过
            glow-squid://ms-auth deeplink 回调返回，无需手动输入代码。
          </p>
          <!-- 登录进度：Rust 每一步广播 ms-login-progress 事件，home.js 更新 -->
          <div class="ms-login-progress" id="ms-login-progress" hidden>
            <md-linear-progress id="ms-login-bar" value="0"></md-linear-progress>
            <p class="ms-login-step" id="ms-login-step"></p>
          </div>
        </div>
      </div>
      <div slot="actions">
        <md-filled-tonal-button slot="cancel" value="cancel" onclick="document.getElementById('add-account-dialog').close()">Cancel</md-filled-tonal-button>
        <md-filled-button slot="confirm" icon="person_add">Add</md-filled-button>
      </div>
    </md-dialog>

    <!-- ── Remove Account menu (删除账号确认菜单) ─────────────
         点 Remove account 弹出 md-menu（不再弹 md-dialog）。点
         「确认删除」菜单项后菜单自动关闭，由 home.js 调用
         delete_account 并刷新账号列表；点击菜单外区域即取消。 -->
    <md-menu id="remove-account-menu" anchor="remove-account-btn"
      corner="BOTTOM_START" positioning="fixed">
      <md-menu-item id="confirm-remove-account-btn">
        <md-icon slot="start">delete</md-icon>
        <div slot="headline">Confirm deletion</div>
      </md-menu-item>
    </md-menu>

    <!-- ── Main panel ─────────────────────────────────────── -->
    <main class="account-page">
      <div id="account-info">
        <img id="skin" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="skin" />
        <div id="account-details">
          <h1 id="username">No account</h1>
          <div class="pill-row">
            <md-filled-button id="change-skin-btn">Change Skin</md-filled-button>
            <md-filled-tonal-button id="remove-account-btn">Remove account</md-filled-tonal-button>
            <md-filled-button id="apply-cape-btn" hidden>Apply Cape Changes</md-filled-button>
          </div>
          <!-- 换肤/换披风的错误或进行中提示（home.js 填充，英文文案） -->
          <p class="skin-cape-message" id="skin-cape-message" role="alert"></p>
          <span class="section-label" id="capes-label">Capes</span>
          <div class="pill-row" id="cape-options"></div>
          <div style="height: 80px;"></div>
        </div>
      </div>
      <div class="pill-row start-mc">
        <md-filled-select id="launch-ver-select"></md-filled-select>
        <md-branded-fab size="large" label="Launch" id="launch-btn"></md-branded-fab>
      </div>
    </main>
    <script type="module" src="./src/js/home.js"></script>
  </body>
</html>
